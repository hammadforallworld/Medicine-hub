<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePharma | Premium Medicine Delivery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-notes-medical"></i> CarePharma
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for medicines...">
        </div>
        <div class="nav-actions">
            <button id="cartBtn" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartBadge" class="badge">0</span>
            </button>
        </div>
    </nav>

    <header class="hero">
        <h1>Your Health, Delivered Safely.</h1>
        <p>Reliable, authentic medicines at your doorstep with premium care.</p>
    </header>

    <main class="container">
        <div id="productGrid" class="product-grid"></div>
    </main>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeCart">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-footer">
                <div class="total">Total: $<span id="cartTotal">0.00</span></div>
                <button id="checkoutBtn" class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <div id="paymentModal" class="modal">
        <div class="modal-content payment-content">
            <span class="close-btn" id="closePayment">&times;</span>
            <h2>Secure Checkout</h2>
            <p>Total Amount: $<span id="paymentTotal">0.00</span></p>
            <form id="paymentForm">
                <div class="input-group">
                    <label>Cardholder Name</label>
                    <input type="text" required placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Card Number</label>
                    <input type="text" required placeholder="XXXX-XXXX-XXXX-XXXX">
                </div>
                <div class="payment-row">
                    <div class="input-group">
                        <label>Expiry</label>
                        <input type="text" required placeholder="MM/YY">
                    </div>
                    <div class="input-group">
                        <label>CVV</label>
                        <input type="password" required placeholder="123">
                    </div>
                </div>
                <button type="submit" class="pay-btn">Confirm Payment</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
